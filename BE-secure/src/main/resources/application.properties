spring.application.name=be-secure

# Porta del backend SICURO
server.port=8082

# Stesso database H2 in memoria del backend vulnerabile (dati identici per un confronto onesto)
spring.datasource.url=jdbc:h2:mem:securedb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# Origine dell'unico frontend legittimo: usata per il controllo anti-CSRF
app.frontend-origin=http://localhost:5173
